[workspace]
resolver = "2"
members = [
  "crates/sdkwork-api-shop-assembly",
  "crates/sdkwork-shop-service",
  "crates/sdkwork-shop-repository-sqlx",
  "crates/sdkwork-routes-shop-app-api",
  "crates/sdkwork-routes-shop-backend-api",
  "crates/sdkwork-shop-database-host",
  "crates/sdkwork-shop-service-host",
  "crates/sdkwork-api-shop-standalone-gateway",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
thiserror = "1"
async-trait = "0.1"
sdkwork_contract_service = { path = "../sdkwork-account/crates/sdkwork-contract-service", package = "sdkwork-contract-service" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork_iam_context_service = { path = "../sdkwork-iam/crates/sdkwork-iam-context-service", package = "sdkwork-iam-context-service" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", features = ["postgres"] }
sdkwork-database-ops-http = { path = "../sdkwork-database/crates/sdkwork-database-ops-http" }
sdkwork_shop_service = { path = "crates/sdkwork-shop-service", package = "sdkwork-shop-service" }
sdkwork_shop_repository_sqlx = { path = "crates/sdkwork-shop-repository-sqlx", package = "sdkwork-shop-repository-sqlx" }
sdkwork-routes-shop-app-api = { path = "crates/sdkwork-routes-shop-app-api" }
sdkwork-routes-shop-backend-api = { path = "crates/sdkwork-routes-shop-backend-api" }
sdkwork-api-shop-assembly = { path = "crates/sdkwork-api-shop-assembly" }
sdkwork_shop_database_host = { path = "crates/sdkwork-shop-database-host", package = "sdkwork-shop-database-host" }
sdkwork_shop_service_host = { path = "crates/sdkwork-shop-service-host", package = "sdkwork-shop-service-host" }
sdkwork_api_merchandise_assembly = { path = "../sdkwork-merchandise/crates/sdkwork-api-merchandise-assembly", package = "sdkwork-api-merchandise-assembly" }
sdkwork_merchandise_service = { path = "../sdkwork-merchandise/crates/sdkwork-merchandise-service", package = "sdkwork-merchandise-service" }
sdkwork_merchandise_repository_sqlx = { path = "../sdkwork-merchandise/crates/sdkwork-merchandise-repository-sqlx", package = "sdkwork-merchandise-repository-sqlx" }
sdkwork_merchandise_web_support = { path = "../sdkwork-merchandise/crates/sdkwork-merchandise-web-support", package = "sdkwork-merchandise-web-support" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
