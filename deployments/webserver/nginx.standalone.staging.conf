# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/shop/webserver.pid;
error_log /var/log/sdkwork/shop/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name shop-staging.sdkwork.com shop-staging.birdcoder.com shop-staging.dtupay.com shop-staging.sdkwork.cn shop-staging.birdcoder.cn shop-staging.dtupay.cn shop-staging.skubc.com shop-staging.skubc.cn shop-staging.zowalk.com shop-staging.zowalk.cn shop-staging.offer86.com shop-staging.offer86.cn shop-staging.86offer.com shop-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
