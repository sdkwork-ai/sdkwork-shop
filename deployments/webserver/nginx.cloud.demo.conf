# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/shop/webserver.pid;
error_log /var/log/sdkwork/shop/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name shop-demo.sdkwork.com shop-demo.birdcoder.com shop-demo.dtupay.com shop-demo.noaper.com shop-demo.sdkwork.cn shop-demo.birdcoder.cn shop-demo.dtupay.cn shop-demo.noaper.cn shop-demo.skubc.com shop-demo.skubc.cn shop-demo.zowalk.com shop-demo.zowalk.cn shop-demo.offer86.com shop-demo.offer86.cn shop-demo.86offer.com shop-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/shop/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
